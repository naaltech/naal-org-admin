name: Supabase

on:
  push:
    branches: [main]
    paths:
      - supabase/functions/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Depo değişkeni SUPABASE_DEPLOY_ENABLED=true olana kadar çalışmaz (kurulum: README, Deployment)
  functions:
    if: vars.SUPABASE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: supabase-functions
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase functions deploy --project-ref "${{ vars.SUPABASE_PROJECT_ID }}"
